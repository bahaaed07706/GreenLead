# Render Blueprint — public demo deployment.
# https://render.com/docs/blueprint-spec
#
# This describes a *demo* instance, not a production one:
#   * Storage is the instance's ephemeral disk, so the database is rebuilt and
#     re-seeded on every boot. That is deliberate — the demo cleans itself up
#     after visitors have clicked around, and no visitor data is retained.
#   * The demo logins in scripts/seed_demo.py are public by design.
#
# For a real deployment see docs/DEPLOYMENT.md: set APP_ENV=production, attach a
# managed PostgreSQL database, and never run the seed script.

services:
  - type: web
    name: greenlead-demo
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    healthCheckPath: /health

    buildCommand: pip install --upgrade pip && pip install -e ".[dev]"

    # Alembic owns the schema, then the demo dataset is loaded, then the server
    # starts. Render provides $PORT and terminates TLS in front of the app.
    startCommand: >-
      alembic upgrade head &&
      python scripts/seed_demo.py &&
      uvicorn greenlead.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: PYTHON_VERSION
        value: "3.12"

      # Not "production": the seed script refuses to run in a production
      # environment, and this instance must seed itself on every boot.
      - key: APP_ENV
        value: demo

      # Render serves the app over HTTPS, so the session cookie still gets the
      # Secure flag even though APP_ENV is not "production".
      - key: SESSION_COOKIE_SECURE
        value: "true"

      # Generated by Render and never stored in the repository.
      - key: SECRET_KEY
        generateValue: true

      - key: DATABASE_URL
        value: sqlite:///./greenlead_demo.db

      - key: LOG_LEVEL
        value: INFO

      # Branding — change these to make the demo your own.
      - key: APP_NAME
        value: GreenLead
      - key: ORG_NAME
        value: Demo Company
      - key: ORG_INDUSTRY
        value: Technology
