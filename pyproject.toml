[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "greenlead"
version = "0.1.0"
description = "Bilingual business-development & sales-intelligence platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "jinja2>=3.1.2",
    "pydantic>=2.4.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.25.0",
    "python-multipart>=0.0.6",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.0.0",
    "itsdangerous>=2.1.2",
    "slowapi>=0.1.8",
    "sqlalchemy>=2.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "types-passlib",
    "alembic>=1.13"
]
sheets = [
    "gspread>=6.0.0",
    "google-auth>=2.22.0"
]
postgres = [
    "psycopg[binary]>=3.1"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88
# Alembic-generated migration scripts are machine-authored; don't lint them.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom: these calls in argument defaults are
# intentional and safe (they are evaluated per-request by FastAPI).
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Form",
    "fastapi.Path",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["gspread.*", "google.*"]
ignore_missing_imports = true

